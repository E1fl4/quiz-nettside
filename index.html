<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Quiz</title>
    </head>
    <body>
        <div class="spørsmål-container">
            <h1 class="spørsmål-tekst">Test spørsmål?</h1>
            <div class="btn-container valg-container">
                <button class="btn svar svar0">Svar0</button>
                <button class="btn svar svar1">Svar1</button>
                <button class="btn svar svar2">Svar2</button>
                <button class="btn svar svar3">Svar3</button>
            </div>
            <div class="svar-tekst-container">
                <input class="svar-tekst" type="text">
            </div>
        </div>
        <div class="resultat-container">
            <h1 class="resultat-tekst">Du fikk <span class="poeng"></span> poeng!</h1>
            <div class="btn-container">
                <button class="restart-btn btn">Start på nytt</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
